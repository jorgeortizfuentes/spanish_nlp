[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanish_nlp"
dynamic = ["version"]
description = "A package for NLP in Spanish"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jorge Ortiz-Fuentes", email = "jorge@ortizfuentes.com" },
]
keywords = [
    "augmentation",
    "clasificacion",
    "classifier",
    "español",
    "nlp",
    "pln",
    "preprocesamiento",
    "preprocess",
    "spanish",
    "language",
    "lenguaje",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "datasets>=3.5.0",
    "emoji>=2.14.1",
    "es_core_news_sm>=3.8.0,<3.9",
    "nltk>=3.9.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "pyspellchecker>=0.8.2",
    "spacy>=3.8.5,<3.9",
    "torch>=2.7.0",
    "tqdm>=4.66",
    "transformers>=4.51.3",
    "unidecode>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/jorgeortizfuentes/spanish_nlp"

[tool.hatch.version]
path = "src/spanish_nlp/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[dependency-groups]
dev = [
    "parameterized>=0.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.16.6",
]
docs = [
    "sphinx>=7.2.6",
]
notebooks = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# es_core_news_sm is not published on PyPI; resolve it from the spaCy models release.
es_core_news_sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501", "F401"]
