[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanish_nlp"
dynamic = ["version"]
description = "A package for NLP in Spanish"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jorge Ortiz-Fuentes", email = "jorge@ortizfuentes.com" },
]
keywords = [
    "augmentation",
    "clasificacion",
    "classifier",
    "español",
    "nlp",
    "pln",
    "preprocesamiento",
    "preprocess",
    "spanish",
    "language",
    "lenguaje",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "datasets>=5.0.1",
    "emoji>=2.16.0",
    "es_core_news_sm>=3.8.0,<3.9",
    "nltk>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyspellchecker>=0.9.0",
    "spacy>=3.8.16,<3.9",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
    "unidecode>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/jorgeortizfuentes/spanish_nlp"

[tool.hatch.version]
path = "src/spanish_nlp/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[dependency-groups]
dev = [
    "parameterized>=0.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
docs = [
    "sphinx>=8.1.3",
]
notebooks = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# es_core_news_sm is not published on PyPI; resolve it from the spaCy models release.
es_core_news_sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",  # pycodestyle, pyflakes, isort
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "SIM", "C4", "PIE",  # simplifications
    "PT",                # flake8-pytest-style
    "LOG",               # flake8-logging
    "RUF",               # ruff-specific rules
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API.
"__init__.py" = ["F401", "F403"]
# Tests use unittest-style assertions.
"tests/**" = ["PT009"]
# Intentional unicode text (emojis, styled letters, accents).
"src/spanish_nlp/utils/{emo_unicode,stopwords}.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_preprocess.py" = ["RUF001", "RUF002", "RUF003"]
"examples/Preprocess.ipynb" = ["RUF001", "RUF002", "RUF003"]
